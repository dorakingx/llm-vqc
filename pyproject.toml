[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-vqc"
version = "0.1.0"
description = "LLM agent for exploring quantum circuit equivalence classes via Clifford BFS"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40",
    "qiskit>=1.0",
    "python-dotenv>=1.0",
    "matplotlib>=3.8",
    "pylatexenc>=2.10",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "pennylane>=0.40",
    "torch>=2.0",
    "scikit-learn>=1.3",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
llm-vqc = "llm_vqc.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["llm_vqc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
